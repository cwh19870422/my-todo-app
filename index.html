<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待辦事項</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007AFF">
<style>
  :root{
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --blue: #007AFF;
    --red: #FF3B30;
    --green: #34C759;
    --orange: #FF9500;
    --purple: #AF52DE;
    --teal: #30B0C7;
    --pink: #FF2D55;
    --label: #1C1C1E;
    --label2: #8E8E93;
    --sep: rgba(60,60,67,0.15);
    --fill: #EFEFF2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--label);
    display: flex; justify-content: center;
  }
  .screen { width: 100%; max-width: 420px; padding: 20px 16px 50px; }

  .title-block { padding: 6px 4px 10px; }
  .title-block .date { font-size: 13px; color: var(--label2); }

  .segmented {
    display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-bottom: 14px;
  }
  .segmented button {
    flex: 1; border: none; background: transparent; padding: 6px 0; font-size: 13px;
    font-weight: 600; color: var(--label2); border-radius: 7px; cursor: pointer;
    font-family: inherit; transition: background 0.15s, color 0.15s;
  }
  .segmented button.active { background: var(--card); color: var(--label); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

  .card { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }

  .field-group { display: flex; flex-direction: column; }
  .field-row { display: flex; align-items: center; padding: 8px 12px; gap: 10px; border-bottom: 0.5px solid var(--sep); }
  .field-row:last-child { border-bottom: none; }
  .field-row input[type="text"], .field-row input[type="datetime-local"] {
    border: none; outline: none; font-family: inherit; font-size: 14px; color: var(--label);
    background: transparent; flex: 1; padding: 0;
  }
  .field-row textarea {
    border: none; outline: none; font-family: inherit; font-size: 14px; color: var(--label);
    background: transparent; flex: 1; padding: 6px 0; resize: none; overflow: hidden;
    line-height: 1.4; min-height: 20px; max-height: 160px;
  }
  .field-row textarea::placeholder { color: #C7C7CC; }
  .field-row input::placeholder { color: #C7C7CC; }
  .field-label { font-size: 14px; color: var(--label); width: 60px; flex-shrink: 0; }
  .field-row input[type="datetime-local"] { text-align: right; color: var(--label2); font-size: 13px; }
  .field-row select {
    border: none; outline: none; font-family: inherit; font-size: 14px; color: var(--label2);
    background: transparent; flex: 1; text-align: right; -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .edit-row select {
    background: var(--fill); border: none; border-radius: 8px; font-family: inherit;
    font-size: 13px; color: var(--label); padding: 8px 10px; outline: none; -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .tag.repeat-tag { display: flex; align-items: center; gap: 3px; background: rgba(0,122,255,0.12); color: var(--blue); }
  .tag.repeat-tag svg { width: 11px; height: 11px; }

  .more-toggle {
    display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%;
    background: transparent; border: none; border-bottom: 0.5px solid var(--sep);
    font-family: inherit; font-size: 12px; color: var(--label2); padding: 7px 0; cursor: pointer;
  }
  .more-toggle svg { width: 11px; height: 11px; transition: transform 0.15s; }
  .more-toggle.open svg { transform: rotate(180deg); }
  .more-options { display: none; }
  .more-options.open { display: block; }

  .toggle-row { display: flex; gap: 8px; padding: 8px 12px; }

  .paste-zone {
    margin: 8px 12px; padding: 12px; border: 1.5px dashed var(--line); border-radius: 10px;
    text-align: center; font-size: 12px; color: var(--label2); cursor: text; position: relative;
  }
  .paste-zone:focus { outline: none; border-color: var(--blue); }
  .paste-zone.has-image { border-style: solid; border-color: var(--sep); padding: 6px; text-align: left; }
  .paste-preview-thumb { width: 100%; max-height: 140px; object-fit: cover; border-radius: 8px; display: block; }
  .remove-image-btn {
    position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff; border: none; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }

  .meta-icon-btn {
    border: none; background: var(--fill); color: var(--label2); width: 22px; height: 22px;
    border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .meta-icon-btn svg { width: 13px; height: 13px; }

  .lightbox-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none;
    align-items: center; justify-content: center; z-index: 1000; padding: 24px;
  }
  .lightbox-overlay.show { display: flex; }
  .lightbox-overlay img { max-width: 92vw; max-height: 88vh; border-radius: 10px; }
  .lightbox-close {
    position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: #fff; border: none; font-size: 18px; cursor: pointer;
  }
  .toggle-pill {
    display: flex; align-items: center; gap: 5px; border: none; font-family: inherit;
    font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 16px; cursor: pointer;
    background: var(--fill); color: var(--label2);
  }
  .toggle-pill.pin.active { background: rgba(255,149,0,0.15); color: var(--orange); }
  .toggle-pill.imp.active { background: rgba(255,59,48,0.15); color: var(--red); }

  .add-inline-btn {
    flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--blue);
    color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .add-inline-btn svg { width: 16px; height: 16px; }
  .add-inline-btn:active { opacity: 0.75; }

  .group { margin-bottom: 14px; }
  .group.dragging { opacity: 0.45; }
  .group-drag-handle {
    flex-shrink: 0; width: 18px; height: 20px; display: flex; align-items: center; justify-content: center;
    color: #C7C7CC; cursor: grab; touch-action: none; margin-left: -4px;
  }
  .group-drag-handle svg { width: 14px; height: 14px; }
  .group-header {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px 8px; cursor: pointer; user-select: none;
  }
  .group-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .group-name { font-size: 13px; font-weight: 600; color: var(--label2); letter-spacing: 0.3px; flex: 1; }
  .group-count { font-size: 12px; color: var(--label2); }
  .group-chevron { width: 14px; height: 14px; color: var(--label2); transition: transform 0.15s; flex-shrink: 0; }
  .group-chevron.collapsed { transform: rotate(-90deg); }
  .group-list { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
  .group-list.collapsed { display: none; }

  li.item {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
    border-bottom: 0.5px solid var(--sep); position: relative; background: var(--card);
  }
  li.item:last-child { border-bottom: none; }
  li.item.important { background: #FFF6DB; }
  li.item.dragging { opacity: 0.45; }

  .drag-handle {
    flex-shrink: 0; width: 20px; height: 24px; display: flex; align-items: center; justify-content: center;
    color: #C7C7CC; cursor: grab; touch-action: none; margin-left: -6px;
  }
  .drag-handle svg { width: 15px; height: 15px; }
  .drag-handle.disabled { opacity: 0.25; cursor: default; }

  .pin-badge {
    position: absolute; top: 10px; right: 14px; font-size: 10px; font-weight: 700;
    color: var(--orange); background: rgba(255,149,0,0.15); padding: 2px 7px; border-radius: 8px;
  }

  .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid #C7C7CC;
    flex-shrink: 0; margin-top: 1px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; background: var(--card);
  }
  .check.done { background: var(--blue); border-color: var(--blue); }
  .check.done svg { width: 13px; height: 13px; }

  .item-body { flex: 1; min-width: 0; padding-right: 58px; cursor: pointer; }
  .item-text { font-size: 16px; line-height: 1.35; word-break: break-word; cursor: pointer; white-space: pre-wrap; }
  .item-text.done { text-decoration: line-through; color: var(--label2); }
  li.item.important .item-text { font-weight: 600; }

  .meta-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; align-items: center; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
  .due-text { font-size: 12px; color: var(--label2); }
  .due-text.overdue { color: var(--red); font-weight: 600; }

  .item-actions {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: row; gap: 14px; align-items: center;
  }
  .item-actions button { background: none; border: none; padding: 0; cursor: pointer; color: #C7C7CC; display: flex; }
  .item-actions button svg { width: 18px; height: 18px; }
  .item-actions button.pin-icon-btn svg { transform: translateY(2px); }
  .item-actions button.active-pin { color: var(--orange); }
  .item-actions button.active-imp { color: var(--red); }

  .edit-panel { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .edit-row { display: flex; gap: 8px; align-items: center; }
  .edit-row input[type="text"] {
    background: var(--fill); border: none; border-radius: 8px; font-family: inherit;
    font-size: 14px; color: var(--label); padding: 8px 10px; outline: none; flex: 1;
  }
  .edit-row input.edit-cat { width: 90px; flex: none; }
  .edit-row input[type="datetime-local"] {
    background: var(--fill); border: none; border-radius: 8px; font-family: inherit;
    font-size: 13px; color: var(--label); padding: 8px 10px; outline: none;
  }
  .edit-actions { display: flex; gap: 8px; }
  .edit-actions button {
    font-family: inherit; font-size: 14px; font-weight: 600; padding: 8px 0; flex: 1;
    border-radius: 9px; cursor: pointer; border: none;
  }
  .edit-actions .save-btn { background: var(--blue); color: #fff; }
  .edit-actions .cancel-btn { background: var(--fill); color: var(--label2); }

  .empty-state { text-align: center; padding: 36px 20px; color: var(--label2); font-size: 14px; background: var(--card); border-radius: 14px; }

  .footer-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; font-size: 13px; color: var(--label2); }
  .footer-row button { background: none; border: none; color: var(--red); font-family: inherit; font-size: 13px; cursor: pointer; padding: 0; }

  .reminder-note { font-size: 11px; color: var(--label2); text-align: center; margin-top: 4px; padding: 0 20px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none;
    align-items: center; justify-content: center; z-index: 999; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    width: min(280px, 100%); background: rgba(250,250,252,0.94); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px); border-radius: 14px; overflow: hidden; text-align: center;
    animation: pop-in 0.18s ease-out; position: relative;
  }
  @keyframes pop-in { from { transform: scale(1.08); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-close {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0,0,0,0.07); border: none; color: var(--label2); font-size: 13px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .modal-close:active { background: rgba(0,0,0,0.14); }
  .modal-label { font-size: 11px; color: var(--label2); text-transform: uppercase; letter-spacing: 0.5px; margin: 18px 16px 0; }
  .modal-name { font-size: 17px; font-weight: 600; margin: 6px 16px 2px; line-height: 1.35; }
  .modal-meta { font-size: 13px; color: var(--label2); margin: 0 16px 16px; }
  .modal-btn {
    width: 100%; border: none; background: transparent; border-top: 0.5px solid var(--sep);
    padding: 12px 0; font-family: inherit; font-size: 17px; color: var(--blue); cursor: pointer;
  }
  .modal-btn:active { background: rgba(0,0,0,0.05); }
  .modal-btn.primary { font-weight: 600; color: var(--green); }
  .modal-snooze-row { display: flex; border-top: 0.5px solid var(--sep); }
  .modal-snooze-btn {
    flex: 1; border: none; background: transparent; border-right: 0.5px solid var(--sep);
    padding: 12px 0; font-family: inherit; font-size: 12px; color: var(--blue); cursor: pointer;
  }
  .modal-snooze-btn:last-child { border-right: none; }
  .modal-snooze-btn:active { background: rgba(0,0,0,0.05); }
</style>
</head>
<body>

<div class="screen">
  <div class="title-block">
    <div class="date" id="date-line"></div>
  </div>

  <div class="segmented">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="active">進行中</button>
    <button class="filter-btn" data-filter="done">已完成</button>
  </div>

  <div class="card">
    <div class="field-group">
      <div class="field-row">
        <textarea id="new-item" placeholder="新增待辦事項" rows="1"></textarea>
        <button type="button" class="add-inline-btn" id="add-btn" aria-label="加入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="field-row">
        <span class="field-label">分類</span>
        <input type="text" id="new-cat" placeholder="例如：工作" maxlength="12" list="cat-list">
        <datalist id="cat-list"></datalist>
      </div>
    </div>
    <button type="button" class="more-toggle" id="more-toggle">
      <span>更多選項</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="more-options" id="more-options">
      <div class="field-row">
        <span class="field-label">到期時間</span>
        <input type="datetime-local" id="new-due">
      </div>
      <div class="field-row">
        <span class="field-label">重複</span>
        <select id="new-repeat">
          <option value="none">不重複</option>
          <option value="daily">每天</option>
          <option value="weekly">每週</option>
          <option value="monthly">每月</option>
        </select>
      </div>
      <div class="toggle-row">
        <button type="button" class="toggle-pill pin" id="new-pin">📌 置頂</button>
        <button type="button" class="toggle-pill imp" id="new-imp">⭐ 重要</button>
      </div>
      <div class="field-row">
        <span class="field-label">備忘</span>
        <textarea id="new-note" placeholder="輸入備忘內容（選填）" rows="1"></textarea>
      </div>
      <div class="paste-zone" id="new-image-zone" tabindex="0">點這裡後按 Ctrl+V 貼上圖片</div>
    </div>
  </div>

  <div id="groups"></div>
  <div id="empty" class="empty-state" style="display:none;">目前沒有待辦事項</div>

  <div class="footer-row">
    <span id="remaining-count">剩餘 0 項</span>
    <button id="clear-done">清除已完成</button>
  </div>
  <div class="footer-row" style="margin-top:2px;">
    <button id="export-backup-btn" style="color: var(--blue);">匯出備份</button>
    <button id="import-backup-btn" style="color: var(--blue);">匯入還原</button>
  </div>
  <input type="file" id="import-file-input" accept="application/json" style="display:none;">
  <div class="reminder-note">到期提醒會在此頁面開啟時彈出，需手動關閉</div>
  <div class="reminder-note" id="auto-backup-note">每天 19:00（頁面需開啟）會自動匯出一次備份</div>
  <div class="save-indicator" style="text-align:center; font-size:11px; color:var(--label2); margin-top:8px;" id="save-indicator"></div>
</div>

<div class="lightbox-overlay" id="note-viewer-overlay">
  <div class="modal-box" style="text-align:left; padding: 4px;">
    <button class="modal-close" id="note-viewer-close" aria-label="關閉">✕</button>
    <div class="modal-label" style="margin-top:16px;">備忘</div>
    <div class="modal-meta" id="note-viewer-content" style="color: var(--label); font-size:14px; line-height:1.5; white-space: pre-wrap; text-align:left; max-height: 50vh; overflow-y:auto;"></div>
    <button class="modal-btn" id="note-viewer-ok">知道了</button>
  </div>
</div>

<div class="lightbox-overlay" id="lightbox-overlay">
  <button class="lightbox-close" id="lightbox-close" aria-label="關閉">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close" aria-label="關閉">✕</button>
    <div class="modal-label">到期提醒</div>
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-meta" id="modal-meta"></div>
    <button class="modal-btn primary" id="modal-done">已完成</button>
    <div class="modal-snooze-row">
      <button class="modal-snooze-btn" data-min="10">+10 分</button>
      <button class="modal-snooze-btn" data-min="30">+30 分</button>
      <button class="modal-snooze-btn" data-min="60">+60 分</button>
      <button class="modal-snooze-btn" data-min="180">+180 分</button>
    </div>
  </div>
</div>

<script>
let todos = [];
let filter = 'all';
let newPinned = false;
let newImportant = false;
let editingId = null;
let newImage = null;
let editImageDraft = null;
let saveTimeout = null;
let reminderQueue = [];
let modalShowing = false;
let currentReminder = null;
let collapsedGroups = new Set();

const CAT_COLORS = ['#007AFF','#34C759','#FF9500','#FF3B30','#AF52DE','#30B0C7','#FF2D55'];

function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % CAT_COLORS.length;
  return CAT_COLORS[Math.abs(h) % CAT_COLORS.length];
}
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function checkSvg() {
  return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 12L13 4" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function pinSvg() {
  return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 00-5 5c0 2.4 1.6 4.2 2.9 5.3L7 17h10l-2.9-4.7C15.4 11.2 17 9.4 17 7a5 5 0 00-5-5zm0 15v5"/></svg>';
}
function starSvg() {
  return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9L22 9.7l-5.5 4.8L18 22l-6-3.9L6 22l1.5-7.5L2 9.7l7.1-.8z"/></svg>';
}
function editSvg() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>';
}
function trashSvg() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function repeatSvg() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>';
}
function gripSvg() {
  return '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.6"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>';
}
function noteSvg() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h5"/></svg>';
}
function imageSvg() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg>';
}
function chevronSvg() {

function compressImage(dataUrl, maxDim, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let width = img.width, height = img.height;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

document.addEventListener('paste', async (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  let imageFile = null;
  for (const item of items) {
    if (item.type && item.type.startsWith('image/')) {
      imageFile = item.getAsFile();
      break;
    }
  }
  if (!imageFile) return;
  e.preventDefault();
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const compressed = await compressImage(ev.target.result, 640, 0.7);
    if (!compressed) return;
    const active = document.activeElement;
    const editPanel = active ? active.closest('.edit-panel') : null;
    if (editPanel && editingId) {
      editImageDraft = compressed;
      render();
    } else {
      newImage = compressed;
      renderNewImagePreview();
    }
  };
  reader.readAsDataURL(imageFile);
});

function advanceOnce(ts, repeat) {
  const d = new Date(ts);
  if (repeat === 'daily') d.setDate(d.getDate() + 1);
  else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
  else if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
  return d.getTime();
}
function advanceUntilFuture(ts, repeat, now) {
  let next = ts;
  let guard = 0;
  while (next <= now && guard < 1000) { next = advanceOnce(next, repeat); guard++; }
  return next;
}

function toggleTodo(id) {

    t.reminded = false;
    t.done = false;

      t.completedAt = Date.now();

function groupKey(cat) { return cat === null || cat === undefined ? '' : cat; }

let categoryOrder = [];

function loadCategoryOrder() {

  } catch (e) { categoryOrder = []; }

  } catch (e) { categoryOrderCustomized = false; }

function saveCategoryOrder() {

}
function ensureCategoryOrder(keys) {
  let changed = false;
  keys.forEach(k => {
    if (!categoryOrder.includes(k)) { categoryOrder.push(k); changed = true; }
  });
  if (changed) saveCategoryOrder();
}
function commitCategoryReorder(newOrder) {
  const visibleSet = new Set(newOrder);
  let ptr = 0;
  categoryOrder = categoryOrder.map(key => visibleSet.has(key) ? newOrder[ptr++] : key);
  newOrder.forEach(k => { if (!categoryOrder.includes(k)) categoryOrder.push(k); });
  if (newOrder.includes('') && newOrder[0] !== '') {
    categoryOrderCustomized = true;
    try { localStorage.setItem('todo-category-order-customized', '1'); } catch (e) {}
  }
  saveCategoryOrder();
}

function getGroups(filteredList) {
  const presentKeys = [];
  todos.filter(Boolean).forEach(t => {
    const key = groupKey(t.category);
    if (!presentKeys.includes(key)) presentKeys.push(key);
  });
  ensureCategoryOrder(presentKeys);

  const buckets = new Map();
  filteredList.filter(Boolean).forEach(t => {
    const key = groupKey(t.category);
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(t);
  });

  let orderedKeys = categoryOrder.filter(k => buckets.has(k));
  buckets.forEach((_, k) => { if (!orderedKeys.includes(k)) orderedKeys.push(k); });

  if (!categoryOrderCustomized && orderedKeys.includes('')) {
    orderedKeys = ['', ...orderedKeys.filter(k => k !== '')];
  }

  const groups = orderedKeys.map(k => [k, buckets.get(k)]);
  groups.forEach(([, items]) => items.sort((a, b) => (a.pinned === b.pinned) ? 0 : (a.pinned ? -1 : 1)));
  return groups;
}

let dragEl = null;

groupsEl.addEventListener('pointerdown', (e) => {
  const handle = e.target.closest('.drag-handle');
  if (!handle || handle.classList.contains('disabled')) return;
  const li = handle.closest('li.item');
  if (!li) return;
  dragEl = li;
  li.classList.add('dragging');
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
  e.preventDefault();
});

function onDragMove(e) {
  if (!dragEl) return;
  const target = document.elementFromPoint(e.clientX, e.clientY);
  const overLi = target ? target.closest('li.item') : null;
  if (!overLi || overLi === dragEl) return;
  if (overLi.parentElement !== dragEl.parentElement) return;
  const overRect = overLi.getBoundingClientRect();
  const before = e.clientY < overRect.top + overRect.height / 2;
  if (before) dragEl.parentElement.insertBefore(dragEl, overLi);
  else dragEl.parentElement.insertBefore(dragEl, overLi.nextSibling);
}

function onDragEnd() {
  if (!dragEl) return;
  dragEl.classList.remove('dragging');
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);

  const ul = dragEl.parentElement;
  const key = ul.dataset.category;
  const newIds = [...new Set([...ul.querySelectorAll('li.item[data-id]')].map(li => li.dataset.id))];

  const categoryItems = todos.filter(t => t && groupKey(t.category) === key);
  const visibleIdSet = new Set(newIds);
  const hiddenInCategory = categoryItems.filter(t => !visibleIdSet.has(t.id));
  const byId = new Map(categoryItems.map(t => [t.id, t]));
  const reorderedVisible = newIds.map(id => byId.get(id)).filter(Boolean);

  if (reorderedVisible.length === newIds.length) {
    const otherItems = todos.filter(t => !t || groupKey(t.category) !== key);
    todos = [...otherItems, ...reorderedVisible, ...hiddenInCategory];
  }

  dragEl = null;
  render();
  saveTodos();
}

let groupDragEl = null;

groupsEl.addEventListener('pointerdown', (e) => {
  const handle = e.target.closest('.group-drag-handle');
  if (!handle) return;

  if (!groupEl) return;
  groupDragEl = groupEl;
  groupEl.classList.add('dragging');
  document.addEventListener('pointermove', onGroupDragMove);
  document.addEventListener('pointerup', onGroupDragEnd);
  document.addEventListener('pointercancel', onGroupDragEnd);
  e.preventDefault();
  e.stopPropagation();
});

function onGroupDragMove(e) {
  if (!groupDragEl) return;
  const target = document.elementFromPoint(e.clientX, e.clientY);
  const overGroup = target ? target.closest('.group') : null;
  if (!overGroup || overGroup === groupDragEl || overGroup.parentElement !== groupsEl) return;
  const rect = overGroup.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  if (before) groupsEl.insertBefore(groupDragEl, overGroup);
  else groupsEl.insertBefore(groupDragEl, overGroup.nextSibling);
}

function onGroupDragEnd() {
  if (!groupDragEl) return;
  groupDragEl.classList.remove('dragging');
  document.removeEventListener('pointermove', onGroupDragMove);
  document.removeEventListener('pointerup', onGroupDragEnd);
  document.removeEventListener('pointercancel', onGroupDragEnd);

  const newOrder = [...groupsEl.querySelectorAll('.group')].map(g => g.dataset.category);
  commitCategoryReorder(newOrder);
  groupDragEl = null;
  render();
}

const lightboxOverlay = document.getElementById('lightbox-overlay');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxClose = document.getElementById('lightbox-close');
function openLightbox(src) {
  lightboxImg.src = src;
  lightboxOverlay.classList.add('show');
}
function closeLightbox() {
  lightboxOverlay.classList.remove('show');
  lightboxImg.src = '';
}
lightboxClose.addEventListener('click', closeLightbox);
lightboxOverlay.addEventListener('click', (e) => {
  if (e.target === lightboxOverlay) closeLightbox();
});

const noteViewerOverlay = document.getElementById('note-viewer-overlay');
const noteViewerContent = document.getElementById('note-viewer-content');
const noteViewerClose = document.getElementById('note-viewer-close');
const noteViewerOk = document.getElementById('note-viewer-ok');
function openNoteViewer(text) {
  noteViewerContent.textContent = text;
  noteViewerOverlay.classList.add('show');
}
function closeNoteViewer() {
  noteViewerOverlay.classList.remove('show');
}
noteViewerClose.addEventListener('click', closeNoteViewer);
noteViewerOk.addEventListener('click', closeNoteViewer);
noteViewerOverlay.addEventListener('click', (e) => {
  if (e.target === noteViewerOverlay) closeNoteViewer();
});

function showNextReminder() {
  if (modalShowing || reminderQueue.length === 0) return;
  currentReminder = reminderQueue.shift();
  modalShowing = true;
  modalName.textContent = currentReminder.text;
  const metaParts = [];
  if (currentReminder.category) metaParts.push(currentReminder.category);
  if (currentReminder.dueAt) metaParts.push(formatDue(currentReminder.dueAt));
  modalMeta.textContent = metaParts.join(' · ');
  modalOverlay.classList.add('show');
}
function closeReminderModal() {
  modalOverlay.classList.remove('show');
  modalShowing = false;
  currentReminder = null;
  setTimeout(showNextReminder, 250);
}
modalCloseBtn.addEventListener('click', () => { closeReminderModal(); });
modalDoneBtn.addEventListener('click', () => {
  if (currentReminder) {
    const t = todos.find(x => x.id === currentReminder.id);
    if (t) {
      if (t.repeat && t.repeat !== 'none' && t.dueAt) {
        t.dueAt = advanceOnce(t.dueAt, t.repeat);
        t.reminded = false;
        t.done = false;
      } else {
        t.done = true;
        t.completedAt = Date.now();
        scheduleHideCompleted();
      }
      render(); saveTodos();
    }
  }
  closeReminderModal();
});
document.querySelectorAll('.modal-snooze-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (currentReminder) {
      const t = todos.find(x => x.id === currentReminder.id);
      if (t) {
        const mins = parseInt(btn.dataset.min, 10);
        t.dueAt = Date.now() + mins * 60000;
        t.reminded = false;
        render(); saveTodos();
      }
    }
    closeReminderModal();
  });
});

setInterval(() => {
  const now = Date.now();
  let changed = false;
  todos.forEach(t => {
    if (t && t.dueAt && !t.done && !t.reminded && t.dueAt <= now) {
      t.reminded = true;
      changed = true;
      reminderQueue.push({ id: t.id, text: t.text, category: t.category, dueAt: t.dueAt });
      if (t.repeat && t.repeat !== 'none') {
        t.dueAt = advanceUntilFuture(t.dueAt, t.repeat, now);
        t.reminded = false;
      }
    }
  });
  if (changed) { saveTodos(); render(); }
  showNextReminder();
}, 5000);

function formatDateForFilename(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function getBackupData() {
  return {
    version: 1,
    exportedAt: new Date().toISOString(),
    todoList: localStorage.getItem('todo-list'),
    collapsedGroups: localStorage.getItem('todo-collapsed-groups'),
    categoryOrder: localStorage.getItem('todo-category-order'),
    categoryOrderCustomized: localStorage.getItem('todo-category-order-customized')
  };
}
function exportBackup() {
  try {
    const data = getBackupData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `todo-${formatDateForFilename(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {}
}
function importBackupFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (typeof data.todoList === 'string') localStorage.setItem('todo-list', data.todoList);
      if (typeof data.collapsedGroups === 'string') localStorage.setItem('todo-collapsed-groups', data.collapsedGroups);
      if (typeof data.categoryOrder === 'string') localStorage.setItem('todo-category-order', data.categoryOrder);
      if (typeof data.categoryOrderCustomized === 'string') localStorage.setItem('todo-category-order-customized', data.categoryOrderCustomized);
      loadCategoryOrder();
      loadCollapsedGroups();
      loadTodos();
      alert('備份還原成功！');
    } catch (err) {
      alert('還原失敗，檔案格式不正確');
    }
  };
  reader.readAsText(file);
}
document.getElementById('export-backup-btn').addEventListener('click', exportBackup);
document.getElementById('import-backup-btn').addEventListener('click', () => {
  document.getElementById('import-file-input').click();
});
document.getElementById('import-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) importBackupFile(file);
  e.target.value = '';
});

function checkAutoExport() {
  const now = new Date();
  const todayStr = formatDateForFilename(now);
  let lastExport = null;
  try { lastExport = localStorage.getItem('todo-last-auto-export'); } catch (e) {}
  if (now.getHours() >= 19 && lastExport !== todayStr) {
    exportBackup();
    try { localStorage.setItem('todo-last-auto-export', todayStr); } catch (e) {}
  }
}
setInterval(checkAutoExport, 60000);

loadCategoryOrder();
loadCollapsedGroups();
loadTodos();
checkAutoExport();
</script>
